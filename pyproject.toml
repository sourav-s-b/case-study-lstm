[project]
name = "db-case"
version = "0.1.0"
description = "Paderborn bearing LSTM anomaly detector + failure simulator (vibration/current + simulated temp/pressure)"
authors = [
    { name = "sourav-s-b", email = "souravsreekumar78@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=16",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "h5py>=3.11",
    "pymatreader>=0.0.32",
    "bearing-datasets>=0.1.1",
    "tqdm>=4.66",
    "jupyter>=1.1",
]

[project.scripts]
db-case = "db_case:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv]
managed = true

[dependency-groups]
dev = ["ruff>=0.6", "pytest>=8"]
